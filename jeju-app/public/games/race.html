<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 그랑프리</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --orange:#ff8a1f; --brown:#4a2f1f; }
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3f4; font-family: 'Jua','Noto Sans KR',sans-serif; color: #fff; }
  canvas { position: fixed; inset: 0; display: block; }
  #hudRoot { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .vp { position: absolute; text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 12px rgba(0,0,0,.3); overflow: hidden; }
  .vp .tag { position: absolute; left: 12px; top: 12px; padding: 4px 14px; border-radius: 16px; font-size: 22px; text-shadow: none; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
  .vp .lap { position: absolute; left: 14px; top: 56px; font-size: 22px; }
  .vp .time { position: absolute; left: 14px; top: 86px; font: 700 14px 'Noto Sans KR'; opacity: .9; }
  .vp .pos { position: absolute; right: 16px; top: 8px; font-size: 54px; line-height: 1; text-align: right; }
  .vp .pos small { font-size: 20px; margin-left: 2px; }
  .vp .pos span { font-size: 18px; opacity: .85; }
  .vp .spd { position: absolute; right: 16px; bottom: 12px; font-size: 62px; line-height: 1; text-align: right; }
  .vp .spd small { display: block; font: 700 13px 'Noto Sans KR'; opacity: .85; letter-spacing: .15em; }
  .vp .nitro { position: absolute; left: 14px; bottom: 16px; width: min(210px, 36%); height: 18px; border-radius: 10px; background: rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.8); overflow: hidden; }
  .vp .nitro i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#27d3ff,#6a5cff); transition: width .1s; }
  .vp .nitro span { position: absolute; inset: 0; text-align: center; font: 700 11px/14px 'Noto Sans KR'; letter-spacing: .2em; text-shadow: none; }
  .vp .nitro.on i { background: linear-gradient(90deg,#ffd23f,#ff5a1a); box-shadow: 0 0 14px #ff9a2f; }
  .vp .msg { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: clamp(30px, 5vw, 64px); opacity: 0; }
  .vp .msg.show { animation: msg 1.4s ease-out forwards; }
  @keyframes msg { 0%{opacity:0;transform:scale(.4)} 15%{opacity:1;transform:scale(1.1)} 25%{transform:scale(1)} 80%{opacity:1} 100%{opacity:0;transform:translateY(-16px)} }
  #divider { position: fixed; z-index: 6; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,.4); display: none; }
  #countdown { position: fixed; left: 0; right: 0; top: 20%; z-index: 7; text-align: center; pointer-events: none; font-size: clamp(100px, 24vw, 220px); line-height: 1; opacity: 0;
    text-shadow: 0 8px 0 #e8741a, 0 12px 0 var(--brown), 0 0 40px rgba(255,200,80,.9); }
  #countdown.show { animation: cd 1s ease-out forwards; }
  @keyframes cd { 0%{opacity:0;transform:scale(2.4)} 20%{opacity:1;transform:scale(1)} 80%{opacity:1} 100%{opacity:0;transform:scale(.85)} }
  #sub { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 7; background: rgba(0,0,0,.6); padding: 8px 20px; border-radius: 20px; font: 700 20px 'Noto Sans KR'; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #sub.show { opacity: 1; }
  #sub::before { content: '🎙 '; }
  #mini { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 7; width: 130px; height: 130px; border-radius: 16px; background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.6); }
  #tools { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 8; display: flex; gap: 8px; }
  #tools button { width: 40px; height: 40px; border-radius: 50%; border: 0; font-size: 18px; background: rgba(0,0,0,.4); cursor: pointer; }
  #tools button.off { opacity: .45; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 15%, rgba(40,25,15,.65) 100%); }
  .overlay.hidden { display: none; }
  .title { font-size: clamp(44px, 9vw, 96px); line-height: 1; margin: 0; text-shadow: 0 6px 0 #e8741a, 0 10px 0 var(--brown), 0 0 30px rgba(255,138,31,.7); }
  .title small { display: block; font: 700 clamp(12px,2vw,18px) 'Noto Sans KR'; letter-spacing: .45em; margin-top: 12px; text-shadow: 0 2px 0 var(--brown); }
  .row { display: flex; gap: 16px; margin-top: 26px; flex-wrap: wrap; justify-content: center; }
  .btn { border: 0; cursor: pointer; font: 400 26px 'Jua'; color: #fff; background: linear-gradient(#ffa83d,#ff7a1a); padding: 14px 40px; border-radius: 40px; box-shadow: 0 6px 0 #b8520e, 0 12px 24px rgba(0,0,0,.3); transition: transform .1s; }
  .btn.blue { background: linear-gradient(#4aa8ff,#1e6fe0); box-shadow: 0 6px 0 #0f4aa0, 0 12px 24px rgba(0,0,0,.3); }
  .btn.gray { background: linear-gradient(#9aa5b8,#6a7488); box-shadow: 0 6px 0 #424a5a, 0 12px 24px rgba(0,0,0,.3); }
  .btn:hover { transform: translateY(-2px) scale(1.03); } .btn:active { transform: translateY(4px); }
  .help { margin-top: 24px; background: rgba(255,255,255,.9); color: var(--brown); border-radius: 18px; padding: 14px 22px; font: 700 14px/1.9 'Noto Sans KR'; max-width: 640px; }
  .help b { color: #e8741a; } .help kbd { background: #fff; border: 2px solid #caa; border-radius: 6px; padding: 0 6px; font: 700 12px 'Noto Sans KR'; }
  #resList { margin-top: 18px; background: rgba(255,255,255,.92); color: var(--brown); border-radius: 18px; padding: 12px 20px; min-width: min(520px, 92vw); font: 700 16px 'Noto Sans KR'; text-align: left; }
  #resList div { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #eadcc8; }
  #resList div:last-child { border: 0; }
  #resList .r { font: 400 26px 'Jua'; width: 44px; color: #e8741a; } #resList i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
  #resList .n { flex: 1; } #resList .t { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="hudRoot"></div>
<div id="divider"></div>
<div id="countdown"></div>
<div id="sub"></div>
<canvas id="mini" width="260" height="260"></canvas>
<div id="tools"><button id="bMusic" title="음악/효과음">🔊</button><button id="bVoice" title="중계 음성">🗣</button></div>

<div id="menu" class="overlay">
  <h1 class="title">제주 그랑프리<small>JEJU GRAND PRIX</small></h1>
  <div class="row"><button class="btn" id="b1p">🏎 1인 레이스</button><button class="btn blue" id="b2p">🏎🏎 2인 대결</button></div>
  <div class="help">
    <b>1P</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 가속·좌우·브레이크 &nbsp; <kbd>Shift</kbd> 니트로<br>
    <b>2P</b> <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> 가속·좌우·브레이크 &nbsp; <kbd>Enter</kbd> 니트로<br>
    ⚡ 노란 화살표 패드를 밟으면 부스터! · 3바퀴를 먼저 도는 사람이 승리 · <kbd>P</kbd> 일시정지<br>
    1인 모드는 WASD와 방향키 둘 다 쓸 수 있어요. 🗣 중계 음성이 나옵니다!
  </div>
</div>
<div id="results" class="overlay hidden">
  <h1 class="title">결과 발표<small>RACE RESULTS</small></h1>
  <div id="resList"></div>
  <div class="row"><button class="btn" id="bAgain">다시 달리기!</button><button class="btn gray" id="bMenu">메뉴로</button></div>
</div>
<div id="pause" class="overlay hidden"><h1 class="title">일시정지<small>P 를 눌러 계속</small></h1></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* =========================================================
   설정 / 유틸
   ========================================================= */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const wrapAng = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const safe = (fn, d) => { try { return fn(); } catch { return d; } };

const N = 720, HW = 9, KERB = 1.3, WALL = 14.5, LAPS = 3;
const MAXV = 58, ACC = 30, BRK = 60, REVMAX = 14;
const COLORS = [0xe53935, 0x1e88e5, 0xfdd835, 0x43a047, 0xab47bc, 0xff8f00];
const AINAMES = ['해녀', '돌하르방', '한라봉', '감귤이'];
const R = { state: 'menu', mode: 1, t: 0, raceT: 0, cd: 0, cdShown: -1, endTimer: -1 };

/* =========================================================
   렌더러 / 씬
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: undefined });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG = 0xcfeaf5;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 140, 780);
scene.add(new THREE.HemisphereLight(0xdff2ff, 0x6a8a4a, 1.7));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.set(150, 260, 100); scene.add(sun);

const dome = new THREE.Mesh(new THREE.SphereGeometry(2400, 24, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x3f9cf0) }, bot: { value: new THREE.Color(FOG) } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(vP.y*1.6+0.05,0.,1.); gl_FragColor = vec4(mix(bot,top,pow(h,.6)),1.); }'
}));
scene.add(dome);

function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const glowTex = canvasTex(128, 128, (g) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
}, false);

/* =========================================================
   트랙 (닫힌 스플라인)
   ========================================================= */
const ctrl = [[0,0],[150,-30],[300,-20],[420,40],[470,150],[400,250],[280,270],[200,200],[120,260],[0,300],[-150,280],[-250,200],[-240,80],[-130,20]]
  .map(([x, z]) => new THREE.Vector3(x, 0, z));
const curve = new THREE.CatmullRomCurve3(ctrl, true, 'centripetal');
const LEN = curve.getLength(), SPACING = LEN / N;
const P = curve.getSpacedPoints(N).slice(0, N);
const T = P.map((_, i) => P[(i + 1) % N].clone().sub(P[(i - 1 + N) % N]).setY(0).normalize());
const NN = T.map(t => new THREE.Vector3(t.z, 0, -t.x));       // = 자동차 기준 왼쪽
const CURV = T.map((t, i) => Math.acos(clamp(t.dot(T[(i + 8) % N]), -1, 1)));

function ribbon(o1, o2, y, vScale, mat, { wall = 0 } = {}) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const k = i % N, a = P[k].clone().addScaledVector(NN[k], o1), b = wall ? a.clone() : P[k].clone().addScaledVector(NN[k], o2);
    pos.push(a.x, y, a.z, b.x, wall ? y + wall : y, b.z);
    const v = i * SPACING / vScale; uv.push(0, v, 1, v);
    if (i < N) { const j = i * 2; idx.push(j, j + 1, j + 2, j + 1, j + 3, j + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

const roadTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3d3f47'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1200; i++) { g.fillStyle = `rgba(${Math.random() < 0.5 ? '255,255,255' : '0,0,0'},${Math.random() * 0.06})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.fillStyle = '#f2f2f2'; g.fillRect(w * 0.025, 0, 6, h); g.fillRect(w * 0.975 - 6, 0, 6, h);
  g.fillStyle = '#ffd23f'; g.fillRect(w * 0.5 - 4, 0, 8, h * 0.5);
});
const kerbTex = canvasTex(32, 64, (g, w, h) => { g.fillStyle = '#e8232a'; g.fillRect(0, 0, w, h / 2); g.fillStyle = '#fff'; g.fillRect(0, h / 2, w, h / 2); });
const wallTex = canvasTex(64, 32, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#1e5fd0'; g.fillRect(0, 0, w / 2, h); g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, h - 5, w, 5); });
{
  const road = ribbon(-HW, HW, 0.03, 24, new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.9, side: THREE.DoubleSide }));
  roadTex.repeat.set(1, 1); scene.add(road);
  const km = new THREE.MeshStandardMaterial({ map: kerbTex, roughness: 0.7, side: THREE.DoubleSide });
  scene.add(ribbon(HW, HW + KERB, 0.05, 5, km), ribbon(-HW - KERB, -HW, 0.05, 5, km));
  const wm = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.8, side: THREE.DoubleSide });
  scene.add(ribbon(WALL, 0, 0, 8, wm, { wall: 1.3 }), ribbon(-WALL, 0, 0, 8, wm, { wall: 1.3 }));
}

// 지면
const grassTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#74b84a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${Math.random() < 0.5 ? '255,255,150' : '30,90,20'},${Math.random() * 0.12})`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
});
grassTex.repeat.set(260, 260);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.position.y = -0.02; scene.add(ground);

// 트랙까지의 거리 (장식 배치용)
function trackDist(x, z) { let m = 1e9; for (let i = 0; i < N; i += 3) { const dx = x - P[i].x, dz = z - P[i].z; m = Math.min(m, dx * dx + dz * dz); } return Math.sqrt(m); }

// 한라산 (인필드)
{
  const geo = new THREE.ConeGeometry(78, 62, 9, 5, true), pos = geo.attributes.position, col = [];
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i), t = (y + 31) / 62;
    pos.setX(i, pos.getX(i) * (1 + (Math.sin(i * 12.9) * 0.05)));
    c.set(0x4f8f3a).lerp(new THREE.Color(0x77706a), clamp((t - 0.55) * 3, 0, 1)); if (t > 0.9) c.set(0xe8eef5);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  m.position.set(130, 31, 120); scene.add(m);
  const lake = new THREE.Mesh(new THREE.CircleGeometry(5, 16).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x4fb8e0, roughness: 0.1 }));
  lake.position.set(130, 61, 120); scene.add(lake);
}

// 귤나무 / 야자수 (InstancedMesh)
{
  const spots = [];
  for (let tries = 0; tries < 2500 && spots.length < 230; tries++) {
    const x = rand(-520, 760), z = rand(-260, 560);
    if (Math.hypot(x - 130, z - 120) < 90 || trackDist(x, z) < 24) continue;
    spots.push([x, z]);
  }
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.35, 0.5, 3, 6), new THREE.MeshStandardMaterial({ color: 0x6b4a2f }), spots.length);
  const crown = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.6, 1), new THREE.MeshStandardMaterial({ color: 0x4f9a3a, flatShading: true }), spots.length);
  const fruit = new THREE.InstancedMesh(new THREE.SphereGeometry(0.4, 8, 6), new THREE.MeshStandardMaterial({ color: 0xff8a1f, emissive: 0x662200, emissiveIntensity: 0.4 }), spots.length * 5);
  const d = new THREE.Object3D(); let f = 0;
  spots.forEach(([x, z], i) => {
    const s = rand(0.8, 1.5);
    d.rotation.set(0, 0, 0); d.scale.setScalar(s); d.position.set(x, 1.5 * s, z); d.updateMatrix(); trunk.setMatrixAt(i, d.matrix);
    d.position.set(x, 4.3 * s, z); d.updateMatrix(); crown.setMatrixAt(i, d.matrix);
    for (let k = 0; k < 5; k++) { const a = Math.random() * 6.28, b = 0.4 + Math.random() * 1.1; d.scale.setScalar(1); d.position.set(x + Math.cos(a) * Math.sin(b) * 2.6 * s, 4.3 * s + Math.cos(b) * 2.6 * s, z + Math.sin(a) * Math.sin(b) * 2.6 * s); d.updateMatrix(); fruit.setMatrixAt(f++, d.matrix); }
  });
  scene.add(trunk, crown, fruit);
  // 유채꽃밭
  const canola = canvasTex(64, 64, (g, w, h) => { g.fillStyle = '#7dbb45'; g.fillRect(0, 0, w, h); for (let i = 0; i < 260; i++) { g.fillStyle = Math.random() < 0.8 ? '#ffd21f' : '#fff3a0'; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); } });
  for (let k = 0, n = 0; k < 400 && n < 16; k++) {
    const x = rand(-500, 740), z = rand(-240, 540), w = rand(30, 70), l = rand(30, 70);
    if (Math.hypot(x - 130, z - 120) < 100 || trackDist(x, z) < 40 + w * 0.5) continue;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: canola.clone(), roughness: 1 }));
    m.material.map.needsUpdate = true; m.material.map.repeat.set(w / 4, l / 4); m.position.set(x, 0.01, z); m.rotation.y = rand(0, 3); scene.add(m); n++;
  }
}

// 관중석 + 시작/결승선 게이트
{
  const h0 = Math.atan2(T[0].x, T[0].z);
  const gate = new THREE.Group(); gate.position.copy(P[0]); gate.rotation.y = h0; scene.add(gate);
  const pm = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.6 });
  for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(1.4, 8, 1.4), pm); p.position.set(s * (HW + 1.6), 4, 0); gate.add(p); }
  const bt = canvasTex(512, 128, (g, w, h) => {
    const s = 16; for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) { g.fillStyle = ((x + y) / s) % 2 ? '#111' : '#fff'; g.fillRect(x, y, s, s); }
    g.fillStyle = 'rgba(255,138,31,.95)'; g.fillRect(40, 22, w - 80, h - 44); g.fillStyle = '#fff'; g.font = 'bold 60px Jua, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🍊 JEJU GP 🍊', w / 2, h / 2 + 3);
  }, false);
  const bn = new THREE.Mesh(new THREE.BoxGeometry(HW * 2 + 3.2, 2.6, 0.5), new THREE.MeshStandardMaterial({ map: bt, emissive: 0x442200, emissiveIntensity: 0.3 }));
  bn.position.set(0, 7.6, 0); gate.add(bn);
  const line = new THREE.Mesh(new THREE.PlaneGeometry(HW * 2, 2.4).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: canvasTex(128, 32, (g, w, h) => { const s = 16; for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) { g.fillStyle = ((x + y) / s) % 2 ? '#111' : '#fff'; g.fillRect(x, y, s, s); } }, false) }));
  line.position.set(0, 0.07, 0); gate.add(line);

  const stand = new THREE.Group(); stand.position.copy(P[12]).addScaledVector(NN[12], -(WALL + 9)); stand.rotation.y = Math.atan2(T[12].x, T[12].z); scene.add(stand);
  const sm = new THREE.MeshStandardMaterial({ color: 0xb8b0a4, roughness: 1 });
  for (let s = 0; s < 4; s++) { const b = new THREE.Mesh(new THREE.BoxGeometry(7, 2 + s * 2, 56), sm); b.position.set(s * 2.4 - 3.6, (2 + s * 2) / 2, 0); stand.add(b); }

/* =========================================================
   게임 진행
   ========================================================= */
function startRace(mode) {

  setupRace(mode);

  arr.forEach((c, i) => { c.rank = i + 1; });

    if (c.finished) { c.lastRank = c.rank; continue; }

}

}

/* =========================================================
   프레임 갱신
   ========================================================= */
function updateCar(c, dt) {

  if (R.state === 'countdown') { c.vx = c.vz = 0; c.vf = 0; if (c.human) readInput(c); }
  else stepCar(c, dt);
}

function updateAudio(dt) {
  if (!ac) return;

    const ratio = clamp(Math.abs(p.vf) / MAXV, 0, 1.3), gear = (ratio * 4.5) % 1;

    const slip = Math.abs(p.vl), skid = R.state === 'race' ? clamp((slip - 4) * 0.025, 0, 0.18) + (p.brake > 0 && p.vf > 25 ? 0.08 : 0) : 0;

}
function updateHud() {
  for (const p of players) {
    const h = p.hud, lap = clamp(Math.floor(p.prog / N) + 1, 1, LAPS);
    h.lap.textContent = `LAP ${p.finished ? LAPS : lap}/${LAPS}`;
    h.time.textContent = `⏱ ${fmt(p.finished ? p.finishT : Math.max(0, R.raceT))}${p.best ? ' · BEST ' + fmt(p.best) : ''}`;
    h.pos.innerHTML = `${p.rank}<small>위</small> <span>/ ${cars.length}</span>`;
    h.spd.innerHTML = `${Math.max(0, Math.round(p.vf * 3.8))}<small>KM/H</small>`;

const miniC = $('mini'), mg = miniC.getContext('2d');
const mini = { off: document.createElement('canvas') };
{
  const xs = P.map(p => p.x), zs = P.map(p => p.z), x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
  const s = 220 / Math.max(x1 - x0, z1 - z0), ox = (260 - (x1 - x0) * s) / 2, oz = (260 - (z1 - z0) * s) / 2;

  const g = mini.off.getContext('2d'); g.lineWidth = 9; g.lineJoin = 'round'; g.strokeStyle = 'rgba(255,255,255,.85)'; g.beginPath();
  P.forEach((p, i) => { const [x, y] = mini.f(p.x, p.z); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); g.stroke();

function drawMini() {
  mg.clearRect(0, 0, 260, 260); mg.drawImage(mini.off, 0, 0);
  for (const c of [...cars].sort((a, b) => a.human - b.human)) {
    const [x, y] = mini.f(c.x, c.z); mg.fillStyle = '#' + c.color.toString(16).padStart(6, '0'); mg.strokeStyle = '#000'; mg.lineWidth = 3;

/* =========================================================
   입력 이벤트 / 버튼
   ========================================================= */
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Slash'].includes(e.code)) e.preventDefault();
  KEYS[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'Enter' && R.state === 'menu') startRace(1);
});
addEventListener('keyup', e => { KEYS[e.code] = false; });
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });
$('b1p').onclick = () => startRace(1); $('b2p').onclick = () => startRace(2);
$('bAgain').onclick = () => startRace(R.mode);
$('bMenu').onclick = () => { R.state = 'menu'; $('results').classList.add('hidden'); $('menu').classList.remove('hidden'); setupRace(1); players.forEach(p => p.hud.root.style.display = 'none'); layout(); };
$('pause').onclick = togglePause;
$('bMusic').onclick = () => { initAudio(); muted = !muted; if (master) master.gain.value = muted ? 0 : 0.85; $('bMusic').textContent = muted ? '🔇' : '🔊'; $('bMusic').classList.toggle('off', muted); };
$('bVoice').onclick = () => { voiceOn = !voiceOn; if (!voiceOn) safe(() => speechSynthesis.cancel()); $('bVoice').classList.toggle('off', !voiceOn); };
if ('speechSynthesis' in window) speechSynthesis.getVoices();
addEventListener('resize', layout);

/* =========================================================
   메인 루프
   ========================================================= */
const clock = new THREE.Clock();
setupRace(1); players.forEach(p => p.hud.root.style.display = 'none');
function frame() {

  if (R.state === 'countdown' || R.state === 'race') {

    for (const c of cars) updateCar(c, dt);
    if (R.state === 'race') {

      if (R.endTimer >= 0) { R.endTimer -= dt; if (R.endTimer <= 0) { R.endTimer = -1; showResults(); } }

    if (R.state === 'results') { for (const c of cars) { c.auto = true; stepCar(c, dt); updateVisuals(c, dt); } }
    const a = R.t * 0.25, o = P[0];
    menuCam.position.set(o.x + Math.cos(a) * 26, 7 + Math.sin(R.t * 0.4) * 1.5, o.z - 20 + Math.sin(a) * 26); menuCam.lookAt(o.x, 3, o.z - 14);

  // 렌더
  renderer.setScissorTest(true);
  const W = innerWidth, H = innerHeight;
  if ((R.state === 'countdown' || R.state === 'race' || R.state === 'paused') && players.length) {
    players.forEach((p, i) => { const v = vps[i]; dome.position.copy(p.cam.position); renderer.setViewport(v.x, v.y, v.w, v.h); renderer.setScissor(v.x, v.y, v.w, v.h); renderer.render(scene, p.cam); });

frame();
window.__race = { R, cars, players, startRace, KEYS };

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>감귤이의 폴짝 대모험</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --orange:#ff8a1f; --brown:#4a2f1f; --cream:#fffaf0; --red:#ff4d6d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3f4; font-family: 'Jua','Noto Sans KR',sans-serif; color: #fff; touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; }
  .hud { position: fixed; z-index: 5; pointer-events: none; text-shadow: 0 3px 0 rgba(74,47,31,.55), 0 0 14px rgba(0,0,0,.25); }
  #score { left: 18px; top: 12px; font-size: 40px; line-height: 1; }
  #score small { display:block; font-size: 15px; opacity:.9; margin-top: 6px; letter-spacing:.05em; }
  #hearts { right: 18px; top: 14px; font-size: 32px; letter-spacing: 2px; }
  #hearts .off { filter: grayscale(1) opacity(.35); }
  #stage { left: 50%; top: 14px; transform: translateX(-50%); font-size: 18px; background: rgba(74,47,31,.55); padding: 6px 16px; border-radius: 20px; text-shadow:none; white-space: nowrap; }
  #banner { left: 0; right: 0; top: 28%; text-align: center; font-size: clamp(34px,7vw,76px); opacity: 0; letter-spacing: .04em; }
  #banner small { display:block; font-size: .3em; letter-spacing:.3em; opacity:.9; font-family:'Noto Sans KR'; font-weight:700; }
  #banner.show { animation: banner 2.2s ease-out; }
  @keyframes banner { 0%{opacity:0;transform:scale(.5)} 15%{opacity:1;transform:scale(1.08)} 25%{transform:scale(1)} 80%{opacity:1} 100%{opacity:0;transform:translateY(-20px)} }
  #count { left: 0; right: 0; top: 24%; text-align: center; font-size: clamp(90px, 22vw, 190px); line-height: 1; opacity: 0; color: #fff;
    text-shadow: 0 8px 0 #e8741a, 0 12px 0 var(--brown), 0 0 36px rgba(255,200,80,.9); }
  #count small { display: block; font: 700 clamp(16px,3vw,24px) 'Noto Sans KR',sans-serif; margin-top: 14px; text-shadow: 0 2px 0 var(--brown); }
  #count.show { animation: count 1s ease-out forwards; }
  @keyframes count { 0%{opacity:0;transform:scale(2.2)} 18%{opacity:1;transform:scale(1)} 80%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(.8)} }
  #combo { right: 22px; top: 30%; text-align: right; font-size: 54px; color: #ffe14d; opacity: 0; }
  #combo small { display:block; font-size: 18px; color:#fff; }
  #combo.bump { animation: bump .25s ease-out; }
  @keyframes bump { 0%{transform:scale(1.5)} 100%{transform:scale(1)} }
  #powers { left: 18px; top: 92px; display: flex; gap: 8px; font-size: 26px; }
  #powers span { background: rgba(0,0,0,.35); border-radius: 12px; padding: 2px 8px; font-size: 18px; text-shadow:none; }
  #energyWrap { left: 50%; bottom: 22px; transform: translateX(-50%); width: min(420px, 62vw); text-align:center; font-size: 15px; }
  #energy { height: 16px; border-radius: 10px; background: rgba(0,0,0,.35); overflow: hidden; margin-top: 4px; border: 2px solid rgba(255,255,255,.7); }
  #energy i { display:block; height:100%; width:0; background: linear-gradient(90deg,#ffd23f,#ff8a1f,#ff4d6d); transition: width .15s; }
  #energy.full { animation: glow .5s infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 18px 4px #ffd23f; } }
  #bubble { left: 18px; bottom: 90px; max-width: 70vw; background:#fff; color: var(--brown); padding: 10px 16px; border-radius: 18px 18px 18px 4px; font-size: 20px; opacity:0; transform: translateY(10px); transition: .25s; text-shadow:none; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  #bubble.show { opacity:1; transform:none; }
  .pop { position: fixed; z-index: 6; pointer-events:none; font-size: 26px; color:#ffe14d; text-shadow: 0 2px 0 rgba(74,47,31,.7); animation: pop .9s ease-out forwards; transform: translate(-50%,-50%); white-space:nowrap; }
  .pop.red { color:#ff6b81 } .pop.big { font-size: 38px; color:#fff }
  @keyframes pop { 0%{opacity:0;transform:translate(-50%,-30%) scale(.5)} 20%{opacity:1;transform:translate(-50%,-60%) scale(1.2)} 100%{opacity:0;transform:translate(-50%,-190%) scale(1)} }
  #flash { position: fixed; inset: 0; z-index: 4; pointer-events:none; opacity: 0; background: #fff; }

  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align:center; padding: 20px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0) 20%, rgba(74,47,31,.55) 100%); }
  .overlay.hidden { display: none; }
  .title { font-size: clamp(42px, 9vw, 92px); line-height: 1.05; margin: 0; color: #fff; text-shadow: 0 6px 0 #e8741a, 0 10px 0 var(--brown), 0 0 30px rgba(255,138,31,.7); }
  .title small { display:block; font-size: .28em; letter-spacing:.4em; font-family:'Noto Sans KR'; font-weight:700; margin-top: 10px; text-shadow: 0 2px 0 var(--brown); }
  .btn { margin-top: 22px; border: 0; cursor: pointer; font: 400 28px 'Jua',sans-serif; color:#fff; background: linear-gradient(#ffa83d,#ff7a1a);
    padding: 14px 52px; border-radius: 40px; box-shadow: 0 6px 0 #b8520e, 0 12px 24px rgba(0,0,0,.3); transition: transform .1s; }
  .btn:hover { transform: translateY(-2px) scale(1.03); } .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8520e; }
  .help { margin-top: 24px; background: rgba(255,255,255,.88); color: var(--brown); border-radius: 18px; padding: 14px 22px; font: 700 14px/1.8 'Noto Sans KR',sans-serif; max-width: 520px; }
  .help b { color: #e8741a; }
  #final { font-size: 24px; margin-top: 10px; line-height: 1.7; text-shadow: 0 2px 0 var(--brown); }
  #final b { font-size: 56px; display:block; color:#ffe14d; }
  .link { margin-top: 14px; color:#fff; font: 700 14px 'Noto Sans KR'; text-decoration: underline; cursor:pointer; }

  #tools { right: 16px; top: 62px; display:flex; gap: 8px; pointer-events: auto; }
  #tools button { width: 42px; height: 42px; border-radius: 50%; border: 0; font-size: 20px; background: rgba(0,0,0,.35); cursor: pointer; filter: none; text-shadow:none; }
  #tools button.off { opacity: .45; }

  #touch { position: fixed; inset: auto 0 0 0; z-index: 7; display: none; justify-content: space-between; padding: 0 16px 70px; pointer-events: none; }
  #touch .grp { display:flex; gap: 12px; pointer-events:auto; }
  #touch button { width: 74px; height: 74px; border-radius: 50%; border: 3px solid rgba(255,255,255,.8); background: rgba(255,138,31,.55); color:#fff; font: 400 26px 'Jua'; }
  @media (pointer: coarse) { #touch { display:flex; } #bubble { bottom: 170px; } }
</style>
</head>
<body>
<div id="flash"></div>
<div id="score" class="hud"><span id="scoreV">0</span><small id="distV">0 m · BEST 0</small></div>
<div id="stage" class="hud">🌼 유채꽃 들판</div>
<div id="hearts" class="hud"></div>
<div id="tools" class="hud"><button id="bMusic" title="음악/효과음">🔊</button><button id="bVoice" title="음성">🗣</button></div>
<div id="powers" class="hud"></div>
<div id="combo" class="hud"></div>
<div id="banner" class="hud"></div>
<div id="count" class="hud"></div>
<div id="bubble" class="hud"></div>
<div id="energyWrap" class="hud">🍊 감귤 대시 <span id="eTxt">(Shift)</span><div id="energy"><i></i></div></div>

<div id="touch">
  <div class="grp"><button id="tL">◀</button><button id="tR">▶</button></div>
  <div class="grp"><button id="tD">💨</button><button id="tJ">⤴</button></div>
</div>

<div id="start" class="overlay">
  <h1 class="title">감귤이의<br>폴짝 대모험<small>JEJU TANGERINE ADVENTURE</small></h1>
  <button class="btn" id="startBtn">출발하기!</button>
  <div class="help">
    <b>← → / A D</b> 좌우 이동 &nbsp; <b>Space / ↑</b> 점프 (공중에서 한 번 더!)<br>
    <b>Shift</b> 감귤 대시 (게이지가 가득 차면!) &nbsp; <b>P</b> 일시정지<br>
    🍊 감귤 모으기 · 🍈 한라봉=방어막 · 🌼 유채꽃=자석 · 🥽 테왁=대시 충전<br>
    모바일: 화면 버튼으로 조작해요 · 🔊 소리와 🗣 음성이 나와요!
  </div>
</div>
<div id="over" class="overlay hidden">
  <h1 class="title">앗, 쓰러졌어요!</h1>
  <div id="final"></div>
  <button class="btn" id="retryBtn">다시 도전!</button>
</div>
<div id="pause" class="overlay hidden"><h1 class="title">일시정지<small>P 또는 화면을 눌러 계속</small></h1></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   상수 / 상태
   ========================================================= */
const L = 24, PATH_W = 9, GRAV = 34, JUMP_V = 13.5, DJUMP_V = 11.5, STAGE_LEN = 900;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const safe = (fn, d) => { try { return fn(); } catch { return d; } };

const THEMES = [
  { name: '유채꽃 들판', icon: '🌼', en: 'CANOLA FIELD', sky: 0x4aa8ee, fog: 0xcdeefa, top: 0x9fd45a, side: 0x6b4a2f, sea: 0x3fb8e0, mount: 0x6f9a8a, line: '노란 유채꽃 들판이야! 향기 좋다!' },
  { name: '현무암 해안', icon: '🌅', en: 'BASALT COAST', sky: 0xb06ad8, fog: 0xffc9a0, top: 0x5c5c68, side: 0x26262c, sea: 0x2a88b0, mount: 0x8a5a78, line: '노을 지는 현무암 해안이다! 멋지다!' },
  { name: '한라산 눈꽃길', icon: '❄️', en: 'HALLASAN SNOW', sky: 0x7d98ff, fog: 0xe6ecff, top: 0xf2f8ff, side: 0x8a98b4, sea: 0x4a78c8, mount: 0xdfe8ff, line: '한라산이다! 눈꽃이 반짝반짝! 조금만 더 힘내!' }
];
THEMES.forEach(t => { for (const k of ['sky','fog','top','side','sea','mount']) t[k + 'C'] = new THREE.Color(t[k]); });

const G = {
  state: 'menu', t: 0, speed: 10, dist: 0, score: 0, lives: 3, combo: 0, comboT: 0, maxCombo: 0, collected: 0,
  energy: 0, dashT: 0, shield: 0, magnet: 0, invuln: 0, shake: 0, stageIdx: 0, nextStageAt: STAGE_LEN,
  best: safe(() => +localStorage.getItem('gyuli-best') || 0, 0), nextMilestone: 500
};
const P = { x: 0, y: 0, z: 0, vy: 0, grounded: true, jumps: 0, targetX: 0, hop: 0, sq: 0, spin: 0, land: 0, plat: null, jumpHeld: false };
const input = { left: false, right: false };

/* =========================================================
   렌더러 / 씬 / 후처리 (블룸)
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(THEMES[0].fog);
scene.fog = new THREE.Fog(THEMES[0].fog, 32, 130);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 500);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.7, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const hemi = new THREE.HemisphereLight(0xffffff, 0x886644, 1.6);
const dir = new THREE.DirectionalLight(0xfff0d0, 2.2);
dir.position.set(6, 14, 8);
scene.add(hemi, dir);

// 하늘 돔 (그라데이션)
const skyU = { top: { value: new THREE.Color(THEMES[0].sky) }, bot: { value: new THREE.Color(THEMES[0].fog) } };
const dome = new THREE.Mesh(new THREE.SphereGeometry(300, 24, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(vP.y*1.5+0.05,0.,1.); gl_FragColor = vec4(mix(bot,top,pow(h,.65)),1.); }'
}));
scene.add(dome);

function glowTexture(color = '255,240,200') {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${color},1)`); gr.addColorStop(0.3, `rgba(${color},.5)`); gr.addColorStop(1, `rgba(${color},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true }));
sunSprite.scale.setScalar(170);
scene.add(sunSprite);

// 멀리 보이는 한라산 실루엣
const mount = new THREE.Mesh(new THREE.ConeGeometry(75, 50, 7), new THREE.MeshBasicMaterial({ color: THEMES[0].mount, fog: false }));
scene.add(mount);

// 바다
const seaMat = new THREE.MeshStandardMaterial({ color: THEMES[0].sea, roughness: 0.25, metalness: 0.15 });
const sea = new THREE.Mesh(new THREE.PlaneGeometry(260, 420).rotateX(-Math.PI / 2), seaMat);
sea.position.y = -2.4;
scene.add(sea);

/* =========================================================
   공용 지오메트리 / 재질
   ========================================================= */
const BOX = new THREE.BoxGeometry(1, 1, 1);
const matTop = new THREE.MeshStandardMaterial({ color: THEMES[0].top, roughness: 0.8 });
const matSide = new THREE.MeshStandardMaterial({ color: THEMES[0].side, roughness: 1, flatShading: true });
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.8, ...o });
const mBasalt = std(0x2e2e34, { roughness: 1 }), mGreen = std(0x4f9a3a), mTrunk = std(0x6b4a2f), mWhite = std(0xffffff, { roughness: 0.6 });
const mYellow = std(0xffd21f, { emissive: 0x664400, emissiveIntensity: 0.6 });
const mTang = new THREE.MeshStandardMaterial({ color: 0xff8a1f, roughness: 0.4, emissive: 0xff6a00, emissiveIntensity: 0.9 });
const mGold = new THREE.MeshStandardMaterial({ color: 0xffd23f, roughness: 0.25, metalness: 0.6, emissive: 0xffa800, emissiveIntensity: 1.2 });
const gTang = new THREE.SphereGeometry(0.28, 14, 12);
const gLeaf = new THREE.SphereGeometry(0.1, 8, 6).scale(1.6, 0.4, 0.9);

/* =========================================================
   오디오 (WebAudio 효과음 + 배경음악) / 음성 (SpeechSynthesis)
   ========================================================= */
let ac, master, musicGain, sfxGain, noiseBuf, muted = false, voiceOn = true;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.85; master.connect(ac.destination);
  musicGain = ac.createGain(); musicGain.gain.value = 0.2; musicGain.connect(master);
  sfxGain = ac.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  startMusic();
}
function tone(f, t, { type = 'sine', vol = 0.3, delay = 0, f2, dest } = {}) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), st = ac.currentTime + Math.max(0, delay);
  o.type = type; o.frequency.setValueAtTime(f, st);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, st + t);
  g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(vol, st + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, st + t);
  o.connect(g).connect(dest || sfxGain); o.start(st); o.stop(st + t + 0.05);
}
function noise(t, vol, f0, f1, { type = 'bandpass', delay = 0, dest } = {}) {
  if (!ac) return;
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), st = ac.currentTime + Math.max(0, delay);
  s.buffer = noiseBuf; fl.type = type; fl.frequency.setValueAtTime(f0, st); fl.frequency.exponentialRampToValueAtTime(f1, st + t);
  g.gain.setValueAtTime(vol, st); g.gain.exponentialRampToValueAtTime(0.0001, st + t);
  s.connect(fl).connect(g).connect(dest || sfxGain); s.start(st); s.stop(st + t + 0.05);
}
const SFX = {
  jump: () => tone(320, 0.18, { type: 'square', f2: 760, vol: 0.14 }),
  djump: () => { tone(520, 0.22, { type: 'triangle', f2: 1250, vol: 0.25 }); tone(1500, 0.18, { type: 'sine', vol: 0.12, delay: 0.05 }); },
  land: () => { tone(130, 0.1, { f2: 60, vol: 0.28 }); },
  coin: c => { const f = 660 * Math.pow(1.0595, Math.min(c, 24)); tone(f, 0.1, { type: 'square', vol: 0.12 }); tone(f * 1.5, 0.16, { type: 'triangle', vol: 0.16, delay: 0.06 }); },
  hit: () => { noise(0.3, 0.7, 1800, 120, { type: 'lowpass' }); tone(220, 0.4, { type: 'sawtooth', f2: 50, vol: 0.3 }); },
  power: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.18, { type: 'triangle', vol: 0.22, delay: i * 0.06 })),
  dash: () => { noise(0.7, 0.5, 400, 4000, { type: 'bandpass' }); tone(200, 0.6, { type: 'sawtooth', f2: 800, vol: 0.12 }); },
  smash: () => { noise(0.2, 0.6, 3000, 300, { type: 'lowpass' }); tone(400, 0.12, { type: 'square', f2: 120, vol: 0.2 }); },
  stage: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, { type: 'triangle', vol: 0.22, delay: i * 0.09 })),
  over: () => [523, 440, 349, 262].forEach((f, i) => tone(f, 0.4, { type: 'triangle', vol: 0.25, delay: i * 0.18 })),
  shield: () => { tone(900, 0.25, { type: 'sine', f2: 300, vol: 0.25 }); noise(0.25, 0.3, 5000, 800, { type: 'highpass' }); },
  ready: () => tone(1200, 0.15, { type: 'sine', vol: 0.2 })
};
const sfx = (n, a) => { if (ac && SFX[n]) SFX[n](a); };

// 배경음악: 펜타토닉 선율 + 베이스 + 드럼, 132 BPM
const BPM = 132, STEP = 60 / BPM / 2;
const SC = [293.66, 329.63, 369.99, 440, 493.88];
const noteF = i => SC[((i % 5) + 5) % 5] * Math.pow(2, Math.floor(i / 5));
const MEL = [4, -1, 2, 4, 5, -1, 4, 2, 3, -1, 1, 3, 4, -1, 2, 0, 2, 2, 4, 5, 7, -1, 5, 4, 3, 4, 3, 1, 2, -1, 0, -1];
const BASS = [73.42, 61.74, 49.0, 55.0];
let nextT = 0, stepI = 0, musicTimer = null;
function playStep(d) {
  const s = stepI % 32, bar = Math.floor(s / 8), m = MEL[s];
  if (m >= 0) tone(noteF(m + 5), STEP * 1.5, { type: 'triangle', vol: 0.34, delay: d, dest: musicGain });
  if (m >= 0 && G.dashT > 0) tone(noteF(m + 10), STEP, { type: 'square', vol: 0.12, delay: d, dest: musicGain });
  if (s % 2 === 0) tone(BASS[bar] * (s % 4 === 0 ? 1 : 2), STEP * 1.6, { type: 'sine', vol: 0.55, delay: d, dest: musicGain });
  if (s % 4 === 0) tone(150, 0.13, { f2: 42, vol: 0.9, delay: d, dest: musicGain });
  if (s % 2 === 1) noise(0.05, 0.22, 7000, 9000, { type: 'highpass', delay: d, dest: musicGain });
  if (s % 8 === 4) noise(0.14, 0.45, 1800, 900, { type: 'bandpass', delay: d, dest: musicGain });
}
function startMusic() {
  if (musicTimer || !ac) return;
  nextT = ac.currentTime + 0.1;
  musicTimer = setInterval(() => {
    if (G.state === 'paused') return;
    while (nextT < ac.currentTime + 0.15) { playStep(nextT - ac.currentTime); nextT += STEP; stepI++; }
    if (nextT < ac.currentTime) nextT = ac.currentTime;
  }, 40);
}

let lastSay = 0, bubbleTimer = 0;
function say(text, { prio = false, pitch = 1.9, rate = 1.15 } = {}) {

  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => b.classList.remove('show'), 2300);

const MAXP = 1800;
const pPos = new Float32Array(MAXP * 3), pCol = new Float32Array(MAXP * 3);
const pVel = new Float32Array(MAXP * 3), pBase = new Float32Array(MAXP * 3), pLife = new Float32Array(MAXP), pMax = new Float32Array(MAXP), pGrav = new Float32Array(MAXP);
for (let i = 0; i < MAXP; i++) pPos[i * 3 + 1] = -999;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.42, map: glowTexture('255,255,255'), vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
pts.frustumCulled = false;
scene.add(pts);
let pIdx = 0;
const tmpC = new THREE.Color();
function emit(x, y, z, color, count, speed, life = 0.7, gravity = 8, vz = 0) {
  tmpC.set(color);
  for (let n = 0; n < count; n++) {
    const i = pIdx; pIdx = (pIdx + 1) % MAXP;
    const a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1), s = speed * (0.3 + Math.random() * 0.7);
    pPos.set([x, y, z], i * 3);
    pVel.set([Math.sin(b) * Math.cos(a) * s, Math.cos(b) * s, Math.sin(b) * Math.sin(a) * s + vz], i * 3);
    pBase.set([tmpC.r, tmpC.g, tmpC.b], i * 3);
    pLife[i] = pMax[i] = life * (0.6 + Math.random() * 0.6); pGrav[i] = gravity;
  }
}
function updateParticles(dt) {
  for (let i = 0; i < MAXP; i++) {
    if (pLife[i] <= 0) { pCol[i * 3] = pCol[i * 3 + 1] = pCol[i * 3 + 2] = 0; continue; }
    pLife[i] -= dt;
    const k = Math.max(0, pLife[i] / pMax[i]);
    pVel[i * 3 + 1] -= pGrav[i] * dt;
    pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt; pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    pCol[i * 3] = pBase[i * 3] * k; pCol[i * 3 + 1] = pBase[i * 3 + 1] * k; pCol[i * 3 + 2] = pBase[i * 3 + 2] * k;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

const rings = [];
function ring(x, y, z, color = 0xffffff, size = 5) {

  m.position.set(x, y, z); scene.add(m); rings.push({ m, t: 0, size });
}
function updateRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += dt * 2.2;
    r.m.scale.setScalar(1 + r.t * r.size); r.m.material.opacity = Math.max(0, 0.9 - r.t);

function addPlatform(ch, x, zc, w, d, move = null) {

function addItem(ch, type, x, y, z) {

function genChunk(z0) {
  const ch = { group: new THREE.Group(), platforms: [], obstacles: [], items: [], z0, zEnd: z0 - L };
  scene.add(ch.group);
  const d = Math.min(1, G.dist / 2500), idx = chunkCount++;
  let type;
  if (idx === 0) type = 'rest'; else if (idx === 1) type = 'easy';
  else {
    const r = Math.random();
    type = r < 0.12 ? 'rest' : r < 0.42 ? 'flat' : r < 0.72 ? 'gaps' : 'stones';
    if (d < 0.1 && type === 'stones') type = 'flat';
  }
  const zc = z0 - L / 2;
  const obstacleTypes = () => { const r = Math.random(); return r < 0.32 ? 'boulder' : r < 0.55 ? 'statue' : r < (d > 0.1 ? 0.78 : 0.7) ? 'crab' : (d > 0.1 ? 'gull' : 'boulder'); };

  if (type === 'rest' || type === 'easy' || type === 'flat') {
    addPlatform(ch, 0, zc, PATH_W, L);
    if (type === 'rest') {
      for (let i = 0; i < 12; i++) addItem(ch, 'tang', Math.sin(i * 0.7) * 3, 0.8, z0 - 2 - i * 1.7);
    } else {
      const n = type === 'easy' ? 1 : 1 + Math.floor(Math.random() * (1 + d * 2.5));
      const slots = [z0 - 5, z0 - 11, z0 - 17, z0 - 22].sort(() => Math.random() - 0.5).slice(0, n);
      let firstX = null;
      for (const sz of slots) {
        const x = rand(-3.2, 3.2); if (firstX === null) firstX = x;
        const ot = obstacleTypes(); addObstacle(ch, ot, x, sz, d);
        line(ch, 'tang', x, sz + 2.4, x, sz - 2.4, 6, 0.9, ot === 'statue' ? 2.0 : 1.3);
      }
      const lane = firstX === null ? 0 : -Math.sign(firstX || 1) * 3;
      line(ch, 'tang', lane, z0 - 2, lane, z0 - L + 2, 8, 0.8, 0);
    }
  } else if (type === 'gaps') {
    const g1 = rand(3, 3.8 + d * 1.2), g2 = rand(3, 3.8 + d * 1.2);
    const len2 = 5, len1 = 6, len3 = Math.max(3, L - len1 - g1 - len2 - g2);
    const z1 = z0 - len1, z2 = z1 - g1 - len2, p3top = z2 - g2;
    addPlatform(ch, 0, z0 - len1 / 2, PATH_W, len1);
    const x2 = rand(-1.5, 1.5), x3 = rand(-1.5, 1.5);
    addPlatform(ch, x2, z1 - g1 - len2 / 2, d > 0.3 ? 6 : PATH_W, len2);
    addPlatform(ch, x3, p3top - len3 / 2, PATH_W, len3);
    line(ch, 'tang', 0, z1 + 1, x2, z1 - g1 - 1, 7, 0.9, 2.2);
    line(ch, 'tang', x2, z2 + 1, x3, p3top - 1, 7, 0.9, 2.2);
    if (Math.random() < 0.3 + d * 0.4) addObstacle(ch, obstacleTypes(), x2 + rand(-1, 1), z1 - g1 - len2 / 2, d);
  } else {
    let x = 0;
    for (let i = 0; i < 4; i++) {
      x = clamp(x + rand(-3.4, 3.4), -3.3, 3.3);
      const mv = d > 0.25 && Math.random() < 0.5 ? { amp: rand(1.2, 2.2), spd: rand(1.2, 2), ph: Math.random() * 6 } : null;
      addPlatform(ch, x, z0 - 2.5 - i * 6.2, 3.6, 3.4, mv);
      if (i < 3) line(ch, 'tang', x, z0 - 2.5 - i * 6.2 - 1.2, x, z0 - 2.5 - (i + 1) * 6.2 + 1.2, 4, 1.0, 1.4);
    }
  }
  if (idx > 1 && Math.random() < 0.22) addItem(ch, pick(['gold', 'magnet', 'boost', 'gold']), rand(-2.5, 2.5), 1.3, zc + rand(-4, 4));

  // 양옆 섬 장식
  for (const s of [-1, 1]) {
    const n = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < n; i++) {
      const x = s * rand(8, 14), z = z0 - rand(2, L - 2);
      const isl = new THREE.Group(), r = rand(2, 3.4);
      const b = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.7, 1.4, 8), matSide); b.position.y = -0.7;
      const c = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.05, r + 0.05, 0.2, 8), matTop); c.position.y = -0.1;
      isl.add(b, c); const dc = decor(G.stageIdx); dc.scale.setScalar(rand(0.9, 1.5)); isl.add(dc);
      isl.position.set(x, rand(-0.6, 0.6), z); ch.group.add(isl);
    }
  }
  chunks.push(ch);
}

  }

function update(dt) {

const camPos = new THREE.Vector3(2.4, 1.7, 4), camLook = new THREE.Vector3(), tl = new THREE.Vector3(), tp = new THREE.Vector3();

    const s = Math.abs(Math.sin(P.hop)); hopY = s * (active ? 0.3 : 0.45);

const KEYS = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  if (KEYS[e.code]) { input[KEYS[e.code]] = true; e.preventDefault(); }
  if (e.repeat) return;
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); P.jumpHeld = true; if (G.state === 'menu') startGame(); else if (G.state === 'over') startGame(); else tryJump(); }

  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'Enter' && (G.state === 'menu' || G.state === 'over')) startGame();
});
addEventListener('keyup', e => {
  if (KEYS[e.code]) input[KEYS[e.code]] = false;
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) P.jumpHeld = false;
});
function hold(id, fn) {

}

}
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') togglePause(); });
$('bMusic').onclick = () => { initAudio(); muted = !muted; if (master) master.gain.value = muted ? 0 : 0.85; $('bMusic').textContent = muted ? '🔇' : '🔊'; $('bMusic').classList.toggle('off', muted); };
$('bVoice').onclick = () => { voiceOn = !voiceOn; if (!voiceOn) safe(() => speechSynthesis.cancel()); $('bVoice').classList.toggle('off', !voiceOn); };
if ('speechSynthesis' in window) speechSynthesis.getVoices();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* =========================================================
   메인 루프
   ========================================================= */
const clock = new THREE.Clock();
resetGame();
camPos.set(P.x + 1.7, 1.5, P.z + 3.6);
function frame() {
  const dt = Math.min(clock.getDelta(), 0.033);
  if (G.state === 'play') { update(dt); updateHUD(); }
  else if (G.state === 'countdown') { updateCountdown(dt); for (const ch of chunks) for (const it of ch.items) it.m.rotation.y += dt * 3; }
  else if (G.state === 'menu' || G.state === 'over') { G.t += dt; for (const ch of chunks) for (const it of ch.items) { it.m.rotation.y += dt * 3; } }
  if (G.state !== 'paused') { animatePlayer(dt); updateParticles(dt); updateRings(dt); }
  updateCamera(dt); updateTheme(dt);
  composer.render();
  requestAnimationFrame(frame);
}
frame();
window.__game = { G, P, startGame, tryJump, tryDash, input };
</script>
</body>
</html>

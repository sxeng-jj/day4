  #nav button.alt { background: linear-gradient(#7fb4ff,#4a86e8); box-shadow: 0 4px 0 #2a5ab0; }

  #nav button:active { transform: translateY(3px); box-shadow: 0 1px 0; } #nav button.off { opacity: .45; } #nav button:disabled { opacity: .35; cursor: default; }
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.2), rgba(255,200,120,.75)); }
  #start.hidden { display: none; }
  #start h1 { margin: 0; font-size: clamp(36px, 7vw, 74px); line-height: 1.1; text-shadow: 0 5px 0 #fff, 0 9px 0 rgba(74,47,31,.3); }
  #start p { font: 700 clamp(15px, 2.4vw, 22px)/1.7 'Noto Sans KR'; margin: 16px 0 0; max-width: 560px; }
  #start button { margin-top: 24px; border: 0; cursor: pointer; font: 400 32px 'Jua'; color: #fff; background: linear-gradient(#ffa83d,#ff7a1a); padding: 16px 56px; border-radius: 40px; box-shadow: 0 7px 0 #b8520e, 0 14px 24px rgba(0,0,0,.25); }

<body>
<div id="top"><div id="title"></div><div id="dots"></div></div>
<div id="bottom">
  <div id="say"><div id="avatar"><b></b><i></i></div><div id="caption"></div></div>
  <div id="nav">
    <button id="bPrev" class="round alt" title="이전">◀</button>
    <button id="bPlay" class="round" title="재생/멈춤">⏸</button>
    <button id="bNext" class="round alt" title="다음">▶</button>
    <button id="bReplay" title="이 장면 다시 보기">🔁 다시</button>
    <button id="bVoice" class="round" title="음성">🗣</button>
  </div>
</div>
<div id="start">
  <h1>🍊 감귤이와 함께<br>AI는 어떻게 말할까?</h1>
  <p>챗GPT, 제미나이, 클로드 같은 AI가 말하는 비밀을<br>그림과 움직임으로 아주 쉽게 알려줄게요!<br>(소리를 켜면 감귤이가 읽어줘요 🔊)</p>
  <button id="startBtn">시작하기!</button>
  <small>드래그로 화면을 돌려볼 수 있어요 · ◀ ▶ 로 장면을 넘겨요</small>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },

const safe = (fn, d) => { try { return fn(); } catch { return d; } };

/* ---------- 렌더러 / 씬 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2.2, 13);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 5; controls.maxDistance = 45; controls.maxPolarAngle = 1.65;
controls.target.set(0, 1.6, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0xffe2b8, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(5, 10, 8); scene.add(sun);

// 바닥 글로우
{
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const f = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  f.position.y = -1.6; scene.add(f);
}
// 떠다니는 비눗방울
const bubbles = [];
for (let i = 0; i < 26; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.1 + Math.random() * 0.25, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false }));
  m.position.set((Math.random() - 0.5) * 30, Math.random() * 12 - 2, -6 - Math.random() * 10); m.userData.v = 0.2 + Math.random() * 0.4; scene.add(m); bubbles.push(m);
}

/* ---------- 파티클 ---------- */
const MAXP = 700, pPos = new Float32Array(MAXP * 3), pCol = new Float32Array(MAXP * 3), pVel = new Float32Array(MAXP * 3), pBase = new Float32Array(MAXP * 3), pLife = new Float32Array(MAXP), pMax = new Float32Array(MAXP);
for (let i = 0; i < MAXP; i++) pPos[i * 3 + 1] = -999;
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const glowC = document.createElement('canvas'); glowC.width = glowC.height = 64; {
  const g = glowC.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, '#fff'); gr.addColorStop(0.4, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
}
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.5, map: new THREE.CanvasTexture(glowC), vertexColors: true, blending: THREE.NormalBlending, depthWrite: false, transparent: true }));
points.frustumCulled = false; scene.add(points);
let pIdx = 0; const tmpC = new THREE.Color();
function emit(x, y, z, color, count, speed, life = 1, gravity = -2) {
  tmpC.set(color);
  for (let n = 0; n < count; n++) {
    const i = pIdx; pIdx = (pIdx + 1) % MAXP;
    const a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1), s = speed * (0.3 + Math.random() * 0.7);
    pPos.set([x, y, z], i * 3); pVel.set([Math.sin(b) * Math.cos(a) * s, Math.cos(b) * s, Math.sin(b) * Math.sin(a) * s], i * 3);
    pBase.set([tmpC.r, tmpC.g, tmpC.b], i * 3); pLife[i] = pMax[i] = life * (0.6 + Math.random() * 0.6);
  }
}
function updateParticles(dt) {
  for (let i = 0; i < MAXP; i++) {
    if (pLife[i] <= 0) { pCol[i * 3] = pCol[i * 3 + 1] = pCol[i * 3 + 2] = 1; pPos[i * 3 + 1] = -999; continue; }
    pLife[i] -= dt; const k = Math.max(0, pLife[i] / pMax[i]);
    pVel[i * 3 + 1] -= 3 * dt;
    pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt; pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    // 흰 배경에서도 보이도록 색을 그대로 두고 크기 대신 밝기로 페이드
    pCol[i * 3] = lerp(1, pBase[i * 3], Math.min(1, k * 1.6)); pCol[i * 3 + 1] = lerp(1, pBase[i * 3 + 1], Math.min(1, k * 1.6)); pCol[i * 3 + 2] = lerp(1, pBase[i * 3 + 2], Math.min(1, k * 1.6));
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

/* ---------- 모양 도우미 ---------- */
function rrShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
function rrBox(w, h, d, color, opts = {}) {
  const geo = new THREE.ExtrudeGeometry(rrShape(w, h, Math.min(w, h) * 0.28), { depth: d, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 3, curveSegments: 6 });
  geo.translate(0, 0, -d / 2);
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.45, ...opts }));
}
const FONT = "Jua, 'Noto Sans KR', sans-serif";
function card(text, { color = 0xffa040, h = 1.1, font = 72, tc = '#4a2f1f', studs = false, depth = 0.3 } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d'); g.font = `${font}px ${FONT}`;
  const tw = g.measureText(text).width; c.width = Math.ceil(tw + font * 0.9); c.height = Math.ceil(font * 1.45);
  g.font = `${font}px ${FONT}`; g.fillStyle = tc; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, c.width / 2, c.height / 2 + font * 0.04);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const w = h * c.width / c.height, grp = new THREE.Group();
  const body = rrBox(w, h, depth, color); grp.add(body);
  const t = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.98, h * 0.98), new THREE.MeshBasicMaterial({ map: tex, transparent: true })); t.position.z = depth / 2 + 0.075; grp.add(t);
  if (studs) for (const s of [-1, 1]) { const st = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.14, h * 0.14, 0.14, 16), body.material); st.position.set(s * w * 0.22, h / 2 + 0.1, 0); grp.add(st); }
  grp.userData = { w, h, body, label: t, tex };
  return grp;
}
function label(text, { size = 0.6, color = '#4a2f1f', font = 64, bg = null } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d'), sp = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthTest: false }));
  const draw = t => {
    g.font = `${font}px ${FONT}`; const w = Math.ceil(g.measureText(t).width + 40); c.width = w; c.height = Math.ceil(font * 1.5);
    g.font = `${font}px ${FONT}`; if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect(0, 0, c.width, c.height, 24); g.fill(); }
    g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t, c.width / 2, c.height / 2 + 3);
    const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; sp.material.map = tx; sp.material.needsUpdate = true; sp.scale.set(size * c.width / c.height, size, 1);
  };
  draw(text); sp.renderOrder = 10; sp.userData.set = draw; return sp;
}
function pop(o, st, t0, dur = 0.6, s0 = 1) { const k = E.outBack(ramp(st, t0, t0 + dur)); o.visible = st >= t0 && k > 0.001; o.scale.setScalar(Math.max(1e-4, k * s0)); }
function layoutRow(items, gap, y, z = 0) {
  const total = items.reduce((s, c) => s + c.userData.w, 0) + gap * (items.length - 1); let x = -total / 2;
  return items.map(c => { const px = x + c.userData.w / 2; x += c.userData.w + gap; c.position.set(px, y, z); c.userData.home = c.position.clone(); return px; });
}
function beam(from, to, lift, color, N = 22) {
  const crv = new THREE.QuadraticBezierCurve3(from, new THREE.Vector3((from.x + to.x) / 2, Math.max(from.y, to.y) + lift, (from.z + to.z) / 2), to);
  const g = new THREE.Group(), geo = new THREE.SphereGeometry(1, 10, 8), mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, emissive: color, emissiveIntensity: 0.35 }), beads = [];
  for (let i = 0; i <= N; i++) { const m = new THREE.Mesh(geo, mat); m.position.copy(crv.getPoint(i / N)); g.add(m); beads.push(m); }
  const run = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff })); g.add(run);
  return { group: g, crv, setR(r, st, speed = 0.8) { beads.forEach(b => b.scale.setScalar(Math.max(1e-4, r))); run.scale.setScalar(r * 1.7 + 0.001); run.position.copy(crv.getPoint((st * speed) % 1)); g.visible = r > 0.003; } };
}
function eyes(host) {
  const g = new THREE.Group(), pupils = [];
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 })); w.position.x = s * 0.28;
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), new THREE.MeshBasicMaterial({ color: 0x1a1010 })); p.position.set(s * 0.28, 0, 0.18); g.add(w, p); pupils.push(p);
  }
  g.position.set(0, host.userData.h / 2 + 0.38, 0.1); host.add(g); g.userData.pupils = pupils; return g;
}
function lookAt2D(eyeG, dx, dy) { const l = Math.hypot(dx, dy) || 1; eyeG.userData.pupils.forEach((p, i) => { p.position.x = (i ? 1 : -1) * 0.28 + dx / l * 0.08; p.position.y = dy / l * 0.08; }); }

function buildGyuli(scale = 1) {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  body.add(new THREE.Mesh(new THREE.SphereGeometry(1.5, 40, 30), new THREE.MeshStandardMaterial({ color: 0xff8a1f, roughness: 0.4, emissive: 0x5a2000, emissiveIntensity: 0.2 })));
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.55, 14, 10).scale(1.7, 0.32, 0.9), new THREE.MeshStandardMaterial({ color: 0x3cb043 })); leaf.position.set(0.45, 1.55, 0); leaf.rotation.z = 0.35;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0x6b4a2f })); stem.position.y = 1.55; body.add(leaf, stem);
  for (const s of [-1, 1]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffffff })); w.position.set(s * 0.5, 0.3, 1.27);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), new THREE.MeshBasicMaterial({ color: 0x1a1010 })); p.position.set(s * 0.5, 0.3, 1.5);
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); h.position.set(s * 0.5 + 0.06, 0.38, 1.64);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 10).scale(1, 0.6, 0.3), new THREE.MeshBasicMaterial({ color: 0xff7a9a, transparent: true, opacity: 0.8 })); b.position.set(s * 0.95, -0.2, 1.13); b.rotation.y = s * 0.7;
    body.add(w, p, h, b);
  }
  const m = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.06, 8, 20, Math.PI), new THREE.MeshBasicMaterial({ color: 0x7a2a10 })); m.rotation.z = Math.PI; m.position.set(0, -0.05, 1.45); body.add(m);
  g.scale.setScalar(scale); g.userData.body = body; return g;
}

/* ---------- 음성 / 자막 ---------- */
let voiceOn = true;
function speak(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  safe(() => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g, '')); u.lang = 'ko-KR'; u.rate = 0.95; u.pitch = 1.4;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('ko')); if (v) u.voice = v;
    speechSynthesis.speak(u);
  });
}

/* =========================================================
   장면들  (모든 움직임은 장면 시간 st 의 함수 → 다시 보기 가능)
   ========================================================= */
// 카드 글자는 캔버스에 그려지므로 웹폰트가 준비된 뒤에 장면을 만든다
await Promise.all([document.fonts.load('48px Jua', '가나다'), document.fonts.load('48px "Noto Sans KR"', '가나다')]).catch(() => {});
const TOK = [
  { w: '감귤이는', c: 0xffb066 }, { w: '맛있는', c: 0xff8fb8 }, { w: '귤을', c: 0xffd75a }
];
const scenes = [];
function addScene(def) { const g = new THREE.Group(); g.visible = false; scene.add(g); def.group = g; def.update = def.build(g); scenes.push(def); }

// 0. 인사
addScene({
  title: '안녕! 나는 <b>감귤이</b>야', dur: 13, cam: [[0, 2.6, 12], [0, 1.6, 0]],
  lines: [
    { t: 0.3, text: '안녕! 나는 <mark>감귤이</mark>야!' },
    { t: 3.5, text: '챗GPT, 제미나이, 클로드 같은 <mark>AI</mark>는 어떻게 말을 할 수 있을까?' },
    { t: 9, text: '아주 쉬운 이야기로 같이 알아보자!' }
  ],
  build(g) {
    const gy = buildGyuli(1.2); g.add(gy);
    const t = card('AI는 어떻게 말할까?', { color: 0xffffff, h: 1.4, font: 80 }); t.position.set(0, 5.2, 0); g.add(t);
    const q = ['?', '?', '?'].map((s, i) => { const l = label(s, { size: 1.1, color: '#ff8a1f', font: 90 }); l.position.set(-3.6 + i * 3.6, 3.4, 0); g.add(l); return l; });
    return st => {
      const b = Math.abs(Math.sin(st * 3.2)); gy.position.y = 1.5 + b * 0.9; gy.userData.body.scale.set(1 + (1 - b) * 0.08, 1 - (1 - b) * 0.12, 1 + (1 - b) * 0.08); gy.rotation.y = Math.sin(st * 1.2) * 0.25;

/* =========================================================
   진행 제어
   ========================================================= */
let idx = -1, st = 0, lineI = 0, playing = true, started = false, camTween = null;
const dots = $('dots'); scenes.forEach(() => dots.appendChild(document.createElement('i')));
function showCaption(html) { $('caption').innerHTML = html; }
function go(i) {
  i = clamp(i, 0, scenes.length - 1);
  if (idx >= 0) scenes[idx].group.visible = false;
  idx = i; st = 0; lineI = 0; const s = scenes[i]; s.group.visible = true;
  $('title').innerHTML = `${i + 1}/${scenes.length} · ${s.title}`; showCaption('');
  [...dots.children].forEach((d, k) => { d.className = k === i ? 'on' : k < i ? 'done' : ''; });
  safe(() => speechSynthesis.cancel());
  const tgt = new THREE.Vector3(...s.cam[1]), far = clamp(1.25 / camera.aspect, 1, 2.2);   // 좁은 화면이면 물러나서 보여준다
  camTween = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(), p1: tgt.clone().add(new THREE.Vector3(...s.cam[0]).sub(tgt).multiplyScalar(far)), t1: tgt };
  controls.autoRotate = false;
  $('bPrev').disabled = i === 0; $('bNext').disabled = i === scenes.length - 1;
}
$('startBtn').onclick = () => { started = true; $('start').classList.add('hidden'); safe(() => speechSynthesis.getVoices()); go(0); };
$('bNext').onclick = () => go(idx + 1); $('bPrev').onclick = () => go(idx - 1); $('bReplay').onclick = () => { playing = true; $('bPlay').textContent = '⏸'; go(idx); };
$('bPlay').onclick = () => { playing = !playing; $('bPlay').textContent = playing ? '⏸' : '▶'; if (!playing) safe(() => speechSynthesis.pause()); else safe(() => speechSynthesis.resume()); };
$('bVoice').onclick = () => { voiceOn = !voiceOn; $('bVoice').classList.toggle('off', !voiceOn); if (!voiceOn) safe(() => speechSynthesis.cancel()); };
addEventListener('keydown', e => { if (!started) return; if (e.code === 'ArrowRight') go(idx + 1); else if (e.code === 'ArrowLeft') go(idx - 1); else if (e.code === 'Space') { e.preventDefault(); $('bPlay').click(); } });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (started && idx >= 0) {
    const s = scenes[idx];
    if (playing) {
      st += dt;
      while (lineI < s.lines.length && st >= s.lines[lineI].t) { showCaption(s.lines[lineI].text); speak(s.lines[lineI].text); lineI++; }
      if (st > s.dur + 2 && idx < scenes.length - 1) go(idx + 1);
    }
    s.update(st, dt);
    controls.autoRotate = !!s.autoRotateFrom && st > s.autoRotateFrom; controls.autoRotateSpeed = 1.2;
    if (camTween) { camTween.t += dt / 1.4; const k = E.io(Math.min(1, camTween.t)); camera.position.lerpVectors(camTween.p0, camTween.p1, k); controls.target.lerpVectors(camTween.t0, camTween.t1, k); if (camTween.t >= 1) camTween = null; }
  }
  bubbles.forEach(b => { b.position.y += b.userData.v * dt; if (b.position.y > 11) b.position.y = -3; });
  updateParticles(dt); controls.update(); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// 글꼴이 준비된 뒤 시작해야 카드 글자가 깨지지 않는다
Promise.all([document.fonts.load('48px Jua'), document.fonts.load('48px "Noto Sans KR"')]).catch(() => {}).finally(() => {});
frame();
window.__tf = { go, scenes, get st() { return st; }, set st(v) { st = v; }, get idx() { return idx; }, start: () => $('startBtn').click(), set playing(v) { playing = v; } };

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20251;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* =========================================================
   렌더러 · 하늘 · 조명
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfeaf5); scene.fog = new THREE.Fog(0xcfeaf5, 85, 300);
// 섬과 모든 3D 요소를 담는 그룹. 키우면 장소 사이가 멀어져 마커가 덜 겹친다. (마커는 이 그룹 밖에서 좌표만 S배)
const S = 1.8;
const world = new THREE.Group(); world.scale.setScalar(S); scene.add(world);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 7; controls.maxDistance = 130; controls.maxPolarAngle = 1.5;

const hemi = new THREE.HemisphereLight(0xffffff, 0xffe2b8, 2.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2); sun.position.set(10, 20, 12); scene.add(sun);
const skyU = { top: { value: new THREE.Color(0x3f9cf0) }, bot: { value: new THREE.Color(0xcfeaf5) } };
const dome = new THREE.Mesh(new THREE.SphereGeometry(260, 24, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(vP.y*1.6+0.05,0.,1.); gl_FragColor = vec4(mix(bot,top,pow(h,.6)),1.); }'
}));
scene.add(dome);
const starGeo = new THREE.BufferGeometry(), sp = [];
for (let i = 0; i < 400; i++) { const a = rnd() * 6.283, b = Math.acos(rnd() * 0.9 + 0.1); sp.push(Math.sin(b) * Math.cos(a) * 240, Math.cos(b) * 240, Math.sin(b) * Math.sin(a) * 240); }
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false })); scene.add(stars);

/* =========================================================
   지형  (타원형 섬 + 한라산 + 오름 + 우도·마라도·비양도·산방산)
   ========================================================= */
const noise = (x, z) => Math.sin(x * 1.7 + 1.3) * Math.cos(z * 1.9) * 0.5 + Math.sin(x * 0.7 + z * 1.1) * 0.5;
const OREUM = [[-6, -2, 0.9, 1.1], [4, -3, 0.8, 1.0], [2.5, -4.2, 0.7, 0.9], [6.6, -0.6, 0.7, 0.8]];
const ISLETS = [[13.5, -3.2, 1.45, 0.75], [-12.4, -1.2, 1.3, 0.6], [-1, 12.3, 0.95, 0.8], [-7.6, 2.4, 2.3, 0.55]];   // 우도, 비양도, 마라도, 산방산
function H(x, z) {
  const mask = 1 - sstep(0.55, 1.0, Math.hypot(x / 11, z / 7));
  let h = -0.35 + 1.25 * Math.pow(mask, 0.8) + 0.1 * noise(x, z) * (0.2 + mask);
  const r2 = (x + 1) ** 2 + (z - 0.5) ** 2;
  h += 5.0 * mask * Math.exp(-r2 / 7.22) - 1.0 * Math.exp(-r2 / 0.5);
  for (const [ox, oz, a, s] of OREUM) h += a * mask * Math.exp(-((x - ox) ** 2 + (z - oz) ** 2) / (2 * s * s));
  const sr = Math.hypot(x - 9, z + 1.5);
  h += 1.4 * Math.exp(-sr * sr / 5.12) + 2.0 * Math.exp(-((sr - 1.2) ** 2) / 0.405);
  for (const [ox, oz, a, s] of ISLETS) h += a * Math.exp(-((x - ox) ** 2 + (z - oz) ** 2) / (2 * s * s));
  return h;
}
const gy = (x, z, min = 0.02) => Math.max(min, H(x, z));
const Cc = h => new THREE.Color(h);
const cSand = Cc(0xeadcae), cSh = Cc(0x6dbfc0), cDeep = Cc(0x3f8fa5), cGA = Cc(0x8fc860), cGB = Cc(0x62a84a), cF = Cc(0x4a7d3c), cRock = Cc(0x7a736d), cBas = Cc(0x37373d);
function colorAt(x, z, h, out) {
  const n = noise(x * 2.3, z * 1.7) * 0.5 + 0.5;
  if (h < 0.12) out.copy(cSand).lerp(cSh, sstep(0.05, -0.15, h)).lerp(cDeep, sstep(-0.15, -0.4, h));
  else { out.copy(cGA).lerp(cGB, n); out.lerp(cF, sstep(1.8, 3.2, h) * 0.9); out.lerp(cRock, sstep(3.9, 4.5, h)); out.lerp(cSand, 1 - sstep(0.12, 0.3, h)); }
  if (h > 0 && h < 0.45 && n > 0.62) out.lerp(cBas, 0.85 * sstep(0.62, 0.7, n));
}
const SX = 36, SZ = 30;
const tg = new THREE.PlaneGeometry(SX, SZ, 120, 100).rotateX(-Math.PI / 2);
{
  const p = tg.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i), h = H(x, z); p.setY(i, h); colorAt(x, z, h, c); col.set([c.r, c.g, c.b], i * 3); }
  tg.setAttribute('color', new THREE.BufferAttribute(col, 3)); tg.computeVertexNormals();
}
world.add(new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 })));
const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.85, ...o });
{ const f = new THREE.Mesh(new THREE.BoxGeometry(SX, 3.2, SZ), std(0x3a7f95, { roughness: 1 })); f.position.y = -2.0;
  const s = new THREE.Mesh(new THREE.BoxGeometry(SX + 0.6, 0.7, SZ + 0.6), std(0x2e2b2e, { roughness: 1 })); s.position.y = -3.95; world.add(f, s); }
const seaMat = new THREE.MeshStandardMaterial({ color: 0x59c3e0, transparent: true, opacity: 0.72, roughness: 0.15, flatShading: true });
const seaGeo = new THREE.PlaneGeometry(SX, SZ, 72, 60).rotateX(-Math.PI / 2);
const sea = new THREE.Mesh(seaGeo, seaMat); sea.position.y = -0.05; world.add(sea);
const seaBase = Float32Array.from(seaGeo.attributes.position.array);
const lake = new THREE.Mesh(new THREE.CircleGeometry(0.55, 20).rotateX(-Math.PI / 2), std(0x4fb8e0, { flatShading: false, roughness: 0.1 })); lake.position.set(-1, H(-1, 0.5) + 0.07, 0.5); world.add(lake);

/* =========================================================
   모델 만들기
   ========================================================= */
const matWhite = std(0xf6f6f2, { roughness: 0.5 }), matRed = std(0xd9483b), matDark = std(0x2f3340), matWood = std(0x9c6a3b), matStone = std(0x6e6c6a, { roughness: 1 });
function turbine(scale = 1) {
  const g = new THREE.Group(), tw = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.1, 2.2, 8), matWhite); tw.position.y = 1.1;
  const nac = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.34), matWhite); nac.position.y = 2.2;
  const rotor = new THREE.Group(); rotor.position.set(0, 2.2, 0.2);
  rotor.add(new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), matWhite));
  for (let i = 0; i < 3; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.05, 0.02).translate(0, 0.52, 0), matWhite); b.rotation.z = i * Math.PI * 2 / 3; rotor.add(b); }
  g.add(tw, nac, rotor); g.scale.setScalar(scale); g.userData.rotor = rotor; g.userData.speed = 1.2 + rnd() * 0.9; return g;
}
const beams = [];
function lighthouse(h = 2.4) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.4, h, 16), matWhite); body.position.y = h / 2;
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.34, 0.3, 16), matRed); band.position.y = h * 0.45;
  const gal = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.08, 16), matDark); gal.position.y = h;
  const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.36, 12), new THREE.MeshStandardMaterial({ color: 0xfff2a8, emissive: 0xffd84a, emissiveIntensity: 1.6 })); lamp.position.y = h + 0.22;
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.3, 12), matRed); cap.position.y = h + 0.55;
  const pivot = new THREE.Group(); pivot.position.y = h + 0.22;
  const mat = new THREE.MeshBasicMaterial({ color: 0xfff2a8, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  for (const s of [1, -1]) { const cone = new THREE.Mesh(new THREE.ConeGeometry(0.55, 5, 20, 1, true).rotateZ(Math.PI / 2).translate(2.5, 0, 0), mat); cone.scale.x = s; pivot.add(cone); }
  g.add(body, band, gal, lamp, cap, pivot); g.userData.pivot = pivot; g.userData.mat = mat; g.userData.lamp = lamp; beams.push(g); return g;
}
function statue(scale = 1) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.36, 0.9, 10), matStone); b.position.y = 0.45;
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.33, 12, 10).scale(1, 1.1, 1), matStone); h.position.y = 1.1;
  const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.33, 0.22, 10), matStone); hat.position.y = 1.5;
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), matStone); nose.position.set(0, 1.07, 0.33);
  g.add(b, h, hat, nose);
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0x111111 })); e.position.set(s * 0.13, 1.17, 0.29);
    const a = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.11, 0.3), matStone); a.position.set(s * 0.12, 0.6, 0.32); g.add(e, a); }
  g.scale.setScalar(scale); return g;
}
const boats = [];
function boat(color = 0xffffff, scale = 1) {
  const g = new THREE.Group(), hull = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.18, 0.34), std(0x2b4a8a)); hull.position.y = 0.08;
  const bow = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.3, 4).rotateZ(-Math.PI / 2).scale(1, 0.55, 1), std(0x2b4a8a)); bow.position.set(0.58, 0.08, 0);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.24, 0.26), std(color)); cab.position.set(-0.1, 0.26, 0);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.5, 5), matDark); mast.position.set(0.15, 0.45, 0);
  g.add(hull, bow, cab, mast); g.scale.setScalar(scale * 1.3); g.userData.ph = rnd() * 6; boats.push(g); return g;
}
const coast = (deg, d = 0.82) => { const a = deg * Math.PI / 180; return [11 * d * Math.cos(a), 7 * d * Math.sin(a)]; };
const outward = (x, z) => { const nx = x / 121, nz = z / 49, l = Math.hypot(nx, nz); return [nx / l, nz / l]; };
function pier(x, z, len, big) {
  const [nx, nz] = outward(x, z), g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = Math.atan2(nx, nz);
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.14, len), std(0xb9b2a6, { roughness: 1 })); p.position.set(0, 0.1, len / 2 - 0.4); g.add(p);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffe9a0, emissive: 0xffd84a, emissiveIntensity: 1.4 })); lamp.position.set(0.2, 0.55, len - 0.5); g.add(lamp);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.45, 6), matDark); post.position.set(0.2, 0.33, len - 0.5); g.add(post);
  if (big) {
    for (const s of [-1, 1]) { const arm = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.2, 0.34), std(0x9a948a, { roughness: 1 })); arm.position.set(s * 0.95, 0.1, len - 0.5); g.add(arm);
      const bt = boat(s > 0 ? 0xffd75a : 0xff8fb8, 1); bt.position.set(s * 0.55, -0.02, len * 0.55); bt.rotation.y = Math.PI / 2; g.add(bt); }
    const crane = new THREE.Group(), pole = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.1, 0.1), matRed); pole.position.y = 0.65; const jib = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, 0.08), matRed); jib.position.set(0.35, 1.2, 0);
    crane.add(pole, jib); crane.position.set(-0.55, 0, 0.5); g.add(crane);
  } else { const bt = boat(0xffd75a, 0.9); bt.position.set(0.6, -0.02, len * 0.6); bt.rotation.y = Math.PI / 2; g.add(bt); }
  return g;
}

/* =========================================================

const CATS = {

  orchard: { name: '감귤 재배지', icon: '🍊', color: '#ff8a1f' }, wind: { name: '풍력발전기', icon: '💨', color: '#2aa198' },

const POIS = [
  { id: 'hallasan', cat: 'spot', name: '한라산 백록담', p: [-1, 0.5], lift: 1.3, desc: '해발 1,947m, 대한민국에서 가장 높은 산이에요. 정상에는 화산 분화구에 물이 고인 백록담이 있어요.' },

function updateHome() {
  farK = clamp(1.3 / camera.aspect, 1, 2.4); homePos.copy(HOME_T).addScaledVector(HOME_OFF, farK);
  HOME_D = homePos.distanceTo(HOME_T); FAR_D = HOME_D * 0.78; LABEL_D = HOME_D * 0.5;   // 처음 시점보다 확대하면 장소가 더 나타난다
}
updateHome(); camera.position.copy(homePos); controls.target.copy(HOME_T);

const state = { sel: -1, tour: false, tourT: 0, tourI: 0, vis: Object.fromEntries(Object.keys(CATS).map(k => [k, true])) };
let camGoal = null;
const TOUR = ['hallasan', 'seongsan', 'olle1', 'udo', 'light-udo', 'geomun', 'wind-gasiri', 'orchard-b', 'statue-seongeup', 'seogwipo-port', 'cheonjiyeon', 'jusangjeolli', 'sanbang', 'wind-hankyung', 'jeju-port', 'light-dodu', 'statue-airport', 'mara'];

function renderUI() {
  $('chips').innerHTML = Object.entries(CATS).map(([k, c]) => `<button class="chip ${state.vis[k] ? '' : 'off'}" data-k="${k}" style="--c:${c.color}"><i></i>${c.icon} ${c.name}<em>${POIS.filter(o => o.cat === k).length}</em></button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { const k = b.dataset.k; state.vis[k] = !state.vis[k]; applyVis(); renderUI(); });
  $('list').innerHTML = Object.entries(CATS).filter(([k]) => state.vis[k]).map(([k, c]) => `<div class="grp">${c.icon} ${c.name}</div>` + POIS.map((o, i) => o.cat === k ? `<button class="item ${state.sel === i ? 'sel' : ''}" data-i="${i}">${o.name}</button>` : '').join('')).join('');
  $('list').querySelectorAll('.item').forEach(b => b.onclick = () => { stopTour(); select(+b.dataset.i); });
}
function applyVis() {
  for (const k in CATS) layerGroups[k].visible = state.vis[k];
  if (state.sel >= 0 && !state.vis[POIS[state.sel].cat]) closeCard();   // 마커 표시는 매 프레임 updateMarkers 가 결정
}
let hoverI = -1;
function updateMarkers(t) {   // 카메라가 FAR_D 보다 멀면 대표 장소만, LABEL_D 보다 가까우면 이름표까지
  const dist = camera.position.distanceTo(controls.target), far = dist > FAR_D && state.sel < 0;
  const iconS = pxScale(ICON_PX), labH = pxScale(LABEL_PX);
  POIS.forEach((o, i) => {
    const on = state.vis[o.cat] && (!far || o.major || i === state.sel), sel = state.sel === i, hov = hoverI === i;
    o.icon.visible = on; o.stem.visible = on;
    o.lab.visible = on && (sel || hov || (dist < LABEL_D && camera.position.distanceTo(o.icon.position) < HOME_D * 0.9));
    if (!on) return;
    const k = sel ? 1.55 + Math.sin(t * 6) * 0.08 : hov ? 1.25 : 1, bob = Math.sin(t * 2 + i) * 0.12, dim = state.sel >= 0 && !sel ? 0.4 : 1;
    o.icon.position.y = o.wtop + bob; o.lab.position.y = o.wtop + bob;
    o.icon.scale.set(iconS * k, iconS * k, 1); o.lab.scale.set(labH * o.lab.userData.aspect * (sel ? 1.2 : 1), labH * (sel ? 1.2 : 1), 1);
    o.icon.material.opacity = dim; o.lab.material.opacity = dim; o.stem.material.opacity = 0.7;
  });
  if (beacon.visible) { const p = (t * 0.9) % 1; bRing2.scale.setScalar(1 + p * 1.6); bRing2.material.opacity = 0.9 * (1 - p); bRing.scale.setScalar(1 + Math.sin(t * 5) * 0.06); bBeam.material.opacity = 0.16 + Math.sin(t * 4) * 0.05; }
}

function select(i, fly = true) {
  state.sel = i; const o = POIS[i], c = CATS[o.cat];
  $('card').classList.add('on'); $('card').style.setProperty('--c', c.color); $('cTag').textContent = `${c.icon} ${c.name}`; $('cName').textContent = o.name; $('cDesc').textContent = o.desc;
  const col = new THREE.Color(c.color); beacon.visible = true; beacon.position.set(o.wx, o.wy + 0.15, o.wz);
  bRing.material.color.copy(col); bRing2.material.color.copy(col); bBeam.material.color.copy(col);
  if (fly) {
    // 장소로 가까이 날아가고, 아래 카드에 가리지 않도록 시선을 조금 아래로 둔다(장소가 화면 윗부분에 보임)
    const k = Math.min(farK, 1.6), t = new THREE.Vector3(o.wx, o.wy + 0.4, o.wz);
    camGoal = { tgt: t.clone().add(new THREE.Vector3(0, -1.0 * k, 0)), pos: t.clone().add(new THREE.Vector3(4.5, 7.5, 11.5).multiplyScalar(k)) };
  }
  renderUI();
}
function closeCard() { state.sel = -1; beacon.visible = false; $('card').classList.remove('on'); renderUI(); }
function goHome() { stopTour(); closeCard(); camGoal = { tgt: HOME_T.clone(), pos: homePos.clone() }; }
function stepSel(d) { const vis = POIS.map((o, i) => i).filter(i => state.vis[POIS[i].cat]); if (!vis.length) return; const cur = vis.indexOf(state.sel); select(vis[(cur + d + vis.length * 2) % vis.length]); }
function stopTour() { state.tour = false; $('tour').textContent = '🎬 자동 투어'; }
function startTour() { state.tour = true; state.tourI = 0; state.tourT = 99; $('tour').textContent = '⏸ 투어 멈춤'; Object.keys(CATS).forEach(k => state.vis[k] = true); applyVis(); renderUI(); }
$('tour').onclick = () => state.tour ? stopTour() : startTour();
$('home').onclick = goHome; $('cClose').onclick = () => { stopTour(); closeCard(); };
$('prev').onclick = () => { stopTour(); stepSel(-1); }; $('next').onclick = () => { stopTour(); stepSel(1); };
$('listBtn').onclick = () => $('listPanel').classList.toggle('on');
controls.addEventListener('start', () => { camGoal = null; stopTour(); });

// 시간대
const TOD = {
  day: { top: 0x3f9cf0, bot: 0xcfeaf5, hemi: 2.1, sun: 0xfff1d6, sunI: 2.2, sea: 0x59c3e0, beam: 0.05, stars: 0, lamp: 0.4 },
  dusk: { top: 0x6a4fb8, bot: 0xffb08a, hemi: 1.5, sun: 0xff9a5a, sunI: 2.0, sea: 0x4a7fb5, beam: 0.45, stars: 0.15, lamp: 1.2 },
  night: { top: 0x070d2e, bot: 0x2b3a74, hemi: 0.6, sun: 0x8fa8ff, sunI: 0.7, sea: 0x1d4a78, beam: 0.95, stars: 1, lamp: 2.2 }
};
let todTarget = 'day'; const cur = { hemi: 2.1, sunI: 2.2, beam: 0.05, stars: 0, lamp: 0.4 }, tmp = new THREE.Color();
document.querySelectorAll('#tod button').forEach(b => b.onclick = () => { todTarget = b.dataset.t; document.querySelectorAll('#tod button').forEach(x => x.classList.toggle('on', x === b)); });
function updateTOD(dt) {
  const T = TOD[todTarget], k = 1 - Math.exp(-dt * 2.5);
  skyU.top.value.lerp(tmp.set(T.top), k); skyU.bot.value.lerp(tmp.set(T.bot), k);
  scene.background.copy(skyU.bot.value); scene.fog.color.copy(skyU.bot.value);
  sun.color.lerp(tmp.set(T.sun), k); seaMat.color.lerp(tmp.set(T.sea), k);
  for (const key of ['hemi', 'sunI', 'beam', 'stars', 'lamp']) cur[key] = lerp(cur[key], T[key], k);
  hemi.intensity = cur.hemi; sun.intensity = cur.sunI; stars.material.opacity = cur.stars;
  beams.forEach(g => { g.userData.mat.opacity = cur.beam; g.userData.lamp.material.emissiveIntensity = cur.lamp; });
  dome.position.copy(camera.position);
}

/* 마우스 */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let down = null;
const pickAt = ev => { mouse.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera); const hits = ray.intersectObjects(iconList.filter(s => s.visible), false); return hits.length ? hits[0].object.userData.poi : -1; };
renderer.domElement.addEventListener('pointermove', ev => { const i = pickAt(ev), tip = $('tip'); hoverI = i; renderer.domElement.style.cursor = i >= 0 ? 'pointer' : 'grab'; if (i < 0) { tip.style.display = 'none'; return; } tip.style.display = 'block'; tip.style.left = ev.clientX + 14 + 'px'; tip.style.top = ev.clientY + 12 + 'px'; tip.textContent = `${CATS[POIS[i].cat].icon} ${POIS[i].name}`; });
renderer.domElement.addEventListener('pointerdown', ev => { down = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', ev => { if (!down) return; const mv = Math.hypot(ev.clientX - down[0], ev.clientY - down[1]); down = null; if (mv < 6) { const i = pickAt(ev); if (i >= 0) { stopTour(); select(i); } } });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); sizePx(); updateHome(); if (state.sel < 0 && !camGoal) camGoal = { tgt: HOME_T.clone(), pos: homePos.clone() }; });

/* =========================================================
   루프
   ========================================================= */
const clock = new THREE.Clock(), up = new THREE.Vector3(0, 1, 0), tv = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, k = 1 - Math.exp(-dt * 4);
  turbines.forEach(w => { w.userData.rotor.rotation.z -= dt * w.userData.speed; });
  beams.forEach(g => { g.userData.pivot.rotation.y += dt * 1.1; });
  boats.forEach(b => { b.position.y = -0.02 + Math.sin(t * 1.6 + b.userData.ph) * 0.03; b.rotation.z = Math.sin(t * 1.3 + b.userData.ph) * 0.05; });
  { const u = (Math.sin(t * 0.18) + 1) / 2; ferryCurve.getPointAt(u, tv); ferry.position.set(tv.x, -0.02 + Math.sin(t * 2) * 0.03, tv.z); ferryCurve.getTangentAt(u, tv); ferry.rotation.y = Math.atan2(-tv.z, tv.x) + (Math.cos(t * 0.18) < 0 ? Math.PI : 0); }
  { const a = t * 0.05; yacht.position.set(Math.cos(a) * 15, -0.02, Math.sin(a) * 11.5); yacht.rotation.y = -a - Math.PI / 2; }
  olleBeads.forEach((m, i) => { olleCurve.getPointAt((t * 0.02 + i / olleBeads.length) % 1, m.position); m.position.y += 0.1; m.scale.setScalar(0.8 + Math.sin(t * 5 + i) * 0.25); });
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 34) c.position.x = -34; });
  updateMarkers(t);
  if (state.tour) { state.tourT += dt; if (state.tourT > 6) { state.tourT = 0; const id = TOUR[state.tourI++ % TOUR.length], i = POIS.findIndex(o => o.id === id); if (i >= 0) select(i); } }
  if (camGoal) { camera.position.lerp(camGoal.pos, k * 0.7); controls.target.lerp(camGoal.tgt, k * 0.7); if (camera.position.distanceTo(camGoal.pos) < 0.05) camGoal = null; }
  const p = seaGeo.attributes.position; for (let i = 0; i < p.count; i++) p.setY(i, Math.sin(seaBase[i * 3] * 0.7 + t * 1.4) * 0.05 + Math.cos(seaBase[i * 3 + 2] * 0.9 + t * 1.1) * 0.04); p.needsUpdate = true;
  updateTOD(dt); controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
await Promise.all([document.fonts.load('40px Jua', '가나다'), document.fonts.load('40px "Noto Sans KR"', '가나다')]).catch(() => {});
POIS.forEach(o => { const l = nameSprite(o.name); o.lab.material.map = l.material.map; o.lab.material.needsUpdate = true; o.lab.userData.aspect = l.userData.aspect; });
applyVis(); renderUI(); frame();
window.__ex = { POIS, state, select, startTour, goHome, camera };
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three.js Animation</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; }
  canvas { display: block; }
  #space-btn {
    position: fixed; right: 16px; top: 16px; padding: 10px 18px;
    background: #141a33; color: #cfd6ff; border: 1px solid #2c3766; border-radius: 8px;
    font: 14px system-ui, sans-serif; cursor: pointer; text-decoration: none;
  }
  #space-btn:hover { background: #1e2750; }
  #hint {
    position: fixed; left: 16px; bottom: 12px; color: #8a93b8;
    font: 13px/1.4 system-ui, sans-serif; pointer-events: none;
  }
</style>
</head>
<body>
<button id="space-btn" onclick="location.href='space.html'">🚀 우주 보기</button>
<div id="hint">마우스 드래그: 회전 · 휠: 확대/축소</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- 기본 설정 ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060d);
scene.fog = new THREE.FogExp2(0x05060d, 0.035);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// --- 중앙 토러스 노트 ---
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(2, 0.6, 220, 32),
  new THREE.MeshStandardMaterial({ color: 0x6a7bff, metalness: 0.7, roughness: 0.25 })
);
scene.add(knot);

// 와이어프레임 외곽
const wire = new THREE.Mesh(
  new THREE.IcosahedronGeometry(4.2, 1),
  new THREE.MeshBasicMaterial({ color: 0x2a3566, wireframe: true, transparent: true, opacity: 0.5 })
);
scene.add(wire);

// --- 궤도를 도는 구체들 ---
const orbiters = [];
const colors = [0xff5d8f, 0x4dffc3, 0xffd166, 0x6ad1ff, 0xc77dff];
colors.forEach((c, i) => {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 24, 24),
    new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.9 })
  );
  const light = new THREE.PointLight(c, 20, 14);
  m.add(light);
  scene.add(m);
  orbiters.push({ mesh: m, radius: 5 + i * 0.7, speed: 0.5 + i * 0.13, tilt: i * 0.6, phase: i * 1.3 });
});

// --- 별 파티클 ---
const N = 2500;
const pos = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const r = 15 + Math.random() * 60;
  const t = Math.random() * Math.PI * 2;
  const p = Math.acos(2 * Math.random() - 1);
  pos[i * 3]     = r * Math.sin(p) * Math.cos(t);
  pos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
  pos[i * 3 + 2] = r * Math.cos(p);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xaab4ff, size: 0.12, sizeAttenuation: true }));
scene.add(stars);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));

// --- 애니메이션 루프 ---
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();

  knot.rotation.x = t * 0.4;
  knot.rotation.y = t * 0.6;
  knot.material.color.setHSL((t * 0.05) % 1, 0.7, 0.6);
  knot.scale.setScalar(1 + Math.sin(t * 1.5) * 0.05);

  wire.rotation.y = -t * 0.15;
  wire.rotation.z = t * 0.1;

  for (const o of orbiters) {
    const a = t * o.speed + o.phase;
    o.mesh.position.set(
      Math.cos(a) * o.radius,
      Math.sin(a) * o.radius * Math.sin(o.tilt),
      Math.sin(a) * o.radius * Math.cos(o.tilt)
    );
  }

  stars.rotation.y = t * 0.01;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
